# NetPanel 生产部署编排
#
# ══ 镜像加速 ═══════════════════════════════════════════════════════
# 默认使用南京大学 ghcr 加速镜像（实测国内可直连，整镜像 ~8s 拉完）；
# 海外服务器或可直连 ghcr.io 的环境建议改用官方源：
#   NETPANEL_IMAGE=ghcr.io/pikachuim/netpanel:latest docker compose up -d
# 其它可选镜像源（可用性随时变化，自行测速后填入 NETPANEL_IMAGE 即可）：
#   ghcr.nju.edu.cn   （默认，南京大学，实测可用）
#   ghcr.m.daocloud.io（DaoCloud，对部分仓库返回 403，可用性以实测为准）
# ═══════════════════════════════════════════════════════════════════
#
# 常用命令：
#   docker compose up -d                          # 启动
#   docker compose logs -f                        # 跟日志
#   docker compose pull && docker compose up -d   # 升级到最新版
#
# 首次启动：浏览器访问 http://<主机IP>:8080 完成管理员初始化。
# 数据（SQLite + 配置 + 证书 + 各工具二进制）全部落在 ./data 目录，备份该目录即可。

services:
  netpanel:
    image: ${NETPANEL_IMAGE:-ghcr.nju.edu.cn/pikachuim/netpanel:latest}
    container_name: netpanel
    restart: unless-stopped
    ports:
      - "${NETPANEL_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 面板内下载 cloudflared 等资源的 GitHub 加速镜像（国内强烈建议配置）
      # 可选值示例：https://ghfast.top / https://gh-proxy.com ，留空直连
      - NETPANEL_GH_MIRROR=${NETPANEL_GH_MIRROR:-}
      # Prometheus /metrics 端点鉴权令牌（不配置则该端点匿名可读，建议配置）
      - NETPANEL_METRICS_TOKEN=${NETPANEL_METRICS_TOKEN:-}
      # MCP 服务端令牌（127.0.0.1 监听，未配置时自动生成随机令牌）
      - NETPANEL_MCP_TOKEN=${NETPANEL_MCP_TOKEN:-}
    # EasyTier / WireGuard 等 TUN 组网能力需要 NET_ADMIN 与 /dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 健康检查已内置于镜像 Dockerfile（探活 /api/v1/init/status）
    networks:
      - netpanel-net

networks:
  netpanel-net:
    driver: bridge
