# NetPanel 完整部署（含 TUN/组网能力）
# 适用场景：需要 EasyTier 异地组网、WireGuard VPN、Mesh 节点等网络功能
#
# 启动方式：
#   docker compose -f docker-compose.full.yml up -d
#
# 仅需 Web 面板和基础功能？改用 docker-compose.minimal.yml（无需 TUN 和特权）

#
# ══ 环境变量 ══════════════════════════════════════════════════════════
#  NETPANEL_IMAGE   镜像地址，默认走南京大学 ghcr 加速镜像
#                   （实测国内可直连；海外/可直连 ghcr.io 的环境改回官方源：
#                    NETPANEL_IMAGE=ghcr.io/pikachuim/netpanel:latest）
#  NETPANEL_PORT    映射端口，默认 8080
#  NETPANEL_GH_MIRROR   面板内下载 cloudflared 等资源的 GitHub 加速镜像前缀
#                   （可选 https://ghfast.top 、https://gh-proxy.com ，留空直连）
#  NETPANEL_METRICS_TOKEN  Prometheus /metrics 端点令牌
#                   （不配置则该端点匿名可读，建议配置）
#  NETPANEL_MCP_TOKEN      MCP 服务端令牌
#                   （127.0.0.1 监听，未配置时自动生成随机令牌）
# ═══════════════════════════════════════════════════════════════════

services:
  netpanel:
    image: ${NETPANEL_IMAGE:-ghcr.nju.edu.cn/pikachuim/netpanel:latest}
    container_name: netpanel
    restart: unless-stopped
    ports:
      - "${NETPANEL_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # 面板内下载 cloudflared 等资源的 GitHub 加速镜像（国内强烈建议配置）
      - NETPANEL_GH_MIRROR=${NETPANEL_GH_MIRROR:-}
      # Prometheus /metrics 端点鉴权令牌（不配置则该端点匿名可读，建议配置）
      - NETPANEL_METRICS_TOKEN=${NETPANEL_METRICS_TOKEN:-}
      # MCP 服务端令牌（127.0.0.1 监听，未配置时自动生成随机令牌）
      - NETPANEL_MCP_TOKEN=${NETPANEL_MCP_TOKEN:-}
    # TUN 设备和组网功能需要以下权限
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - netpanel-net

networks:
  netpanel-net:
    driver: bridge
